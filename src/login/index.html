<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Login</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/main.js" type="module"></script>
  <script src="/js/login.js" type="module"></script>
</head>
<body>
  <header class="divider" id="header"></header>

  <main class="divider">
    <section class="products">
      <h2>Staff Login</h2>
      <p class="form-intro">Sign in to access order management.</p>
      <form class="account-form" id="login-form" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required />
        </div>
        <div class="form-message hide" id="form-message"></div>
        <button type="submit">Sign In</button>
      </form>
    </section>
  </main>

  <footer id="footer"></footer>
</body>
</html>
