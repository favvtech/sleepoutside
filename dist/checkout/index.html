<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>


    <script type="module" crossorigin src="/js/utils.js"></script>
    <script type="module" crossorigin src="/js/main2.js"></script>
    <link rel="stylesheet" crossorigin href="/css/style.css">
  </head>

  <body>
    <header class="divider" id="header">
    </header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>

      <form class="checkout-form">
        <fieldset>
          <legend>Customer Name</legend>
      
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" required />
      
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" required />
        </fieldset>
      
        <fieldset>
          <legend>Address</legend>
      
          <label for="streetAddress">Street Address</label>
          <input type="text" id="streetAddress" name="streetAddress" required />
      
          <label for="city">City</label>
          <input type="text" id="city" name="city" required />
      
          <label for="state">State</label>
          <input type="text" id="state" name="state" required />
      
          <label for="zipCode">Zip Code</label>
          <input type="text" id="zipCode" name="zipCode" required />
        </fieldset>
      
        <fieldset>
          <legend>Payment</legend>
      
          <label for="cardNumber">Credit Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" required />
      
          <label for="expirationDate">Expiration Date</label>
          <input type="month" id="expirationDate" name="expirationDate" required />
      
          <label for="securityCode">Security Code</label>
          <input type="text" id="securityCode" name="securityCode" required />
        </fieldset>
      
        <button type="submit">Checkout</button>
      </form>
    </main>

    <footer id="footer">
    </footer>
  </body>
</html>
